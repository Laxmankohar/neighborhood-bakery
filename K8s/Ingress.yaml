apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bakery-ingress
  annotations:  
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: bakery.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bakery-service
            port:
              number: 80